[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Honest evaluation of RAG over SEC 10-K filings"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter keeps code within line-length; long strings are allowed.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
