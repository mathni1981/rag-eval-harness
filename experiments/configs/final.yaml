# Final design, pre-registered on 2026-11-11 before any held-out results existed.
# See docs/preregistration.md. Do not change this file after the held-out run.
# = baseline + cross-encoder reranking + company-aware retrieval.
name: final
chunking:
  strategy: fixed
  size: 1500
  overlap: 200
retrieval:
  method: dense
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 5
  company_aware: true
  company_k: split
  rerank_model: BAAI/bge-reranker-base
  rerank_candidates: 30
generation:
  model: claude-sonnet-5-5
  max_tokens: 800
  temperature: null
  prompt: cited
