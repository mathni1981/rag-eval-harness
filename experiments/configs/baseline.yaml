# Baseline: fixed-size chunks, dense retrieval, answers with required citations.
name: baseline
chunking:
  strategy: fixed
  size: 1500
  overlap: 200
retrieval:
  method: dense
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 5
generation:
  model: claude-sonnet-5-5
  max_tokens: 800
  temperature: null
  prompt: cited
