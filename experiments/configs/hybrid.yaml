# Experiment: Hybrid retrieval: embeddings + BM25 keyword search, fused by reciprocal rank.
# Identical to baseline.yaml except for that one change.
name: hybrid
chunking:
  strategy: fixed
  size: 1500
  overlap: 200
retrieval:
  method: hybrid
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 5
generation:
  model: claude-sonnet-5-5
  max_tokens: 800
  temperature: null
  prompt: cited
