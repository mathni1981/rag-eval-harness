# Experiment: More excerpts: top 15 instead of 5.
# Identical to baseline.yaml except for that one change.
name: topk15
chunking:
  strategy: fixed
  size: 1500
  overlap: 200
retrieval:
  method: dense
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 15
generation:
  model: claude-sonnet-5-5
  max_tokens: 800
  temperature: null
  prompt: cited
