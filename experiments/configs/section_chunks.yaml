# Experiment: Section-aware chunking: chunks never cross a 10-K Item boundary.
# Identical to baseline.yaml except for that one change.
name: section_chunks
chunking:
  strategy: section
  size: 1500
  overlap: 200
retrieval:
  method: dense
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 5
generation:
  model: claude-sonnet-5-5
  max_tokens: 800
  temperature: null
  prompt: cited
