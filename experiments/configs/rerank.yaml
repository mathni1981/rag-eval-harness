# Experiment: Rerank the top 30 candidates with a cross-encoder, keep the top 5.
# Identical to baseline.yaml except for that one change.
name: rerank
chunking:
  strategy: fixed
  size: 1500
  overlap: 200
retrieval:
  method: dense
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 5
  rerank_model: BAAI/bge-reranker-base
  rerank_candidates: 30
generation:
  model: claude-sonnet-5-5
  max_tokens: 800
  temperature: null
  prompt: cited
