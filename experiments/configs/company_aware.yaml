# Experiment: Search only the named company's filing; for comparisons, search each company separately (about 5 excerpts in total).
# Identical to baseline.yaml except for that one change.
name: company_aware
chunking:
  strategy: fixed
  size: 1500
  overlap: 200
retrieval:
  method: dense
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 5
  company_aware: true
  company_k: split
generation:
  model: claude-sonnet-5-5
  max_tokens: 800
  temperature: null
  prompt: cited
